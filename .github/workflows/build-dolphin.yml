name: Build Dolphin standalone NRO

# Builds ticohq/tico-dolphin's standalone Switch port (dolphin-nx)
# inside the switch-nvk-builder image (Mesa NVK Vulkan static libs
# at /nvk-build — see build-nvk-image.yml) and uploads dolphin.nro.
#
# tico's own builds use a private NVK layer; ours reproduces it from
# HayatoG/switch-nvk's public recipe. First runs are exploratory:
# tico-dolphin's DolphinNX/CMakeLists references the NVK build tree
# (src/nouveau/vulkan/libvulkan.a + assorted include dirs) whose
# exact shape may differ from our bake — failures here map the gap.
#
# Manual trigger while the port stabilises.

on:
  workflow_dispatch:
    inputs:
      dolphin_ref:
        description: "ticohq/tico-dolphin ref to build"
        required: false
        default: "master"
      autoboot_rom:
        description: "TEST ONLY: bake a fallback rom path used when no argv is passed (for emulators that can't pass NRO args)"
        required: false
        default: ""

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/foyer-frontend/switch-nvk-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone tico-dolphin
        run: |
          git config --global --add safe.directory '*'
          git clone --depth 1 --branch "${{ inputs.dolphin_ref }}" \
              https://github.com/ticohq/tico-dolphin.git dolphin
          cd dolphin
          echo "dolphin_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          # Full recursive init — Dolphin's externals nest (e.g.
          # Externals/libspng/libspng) and hand-picking missed
          # several. Total tree is a few hundred MB, acceptable.
          git submodule update --init --recursive --depth 1

      - name: Locate NVK build tree
        run: |
          ls -la /nvk-build/ | head
          find /nvk-build -name 'libvulkan*.a' -o -name 'libnvk.a' | head -10

      - name: Patch NX link block (SDL2 EGL deps)
        shell: bash
        run: |
          # devkitPro's switch-sdl2 video backend references EGL —
          # the portlib normally links -lEGL -lglapi -ldrm_nouveau
          # after it (see sdl2-config --static-libs). tico's
          # DolphinNX CMakeLists lists only libSDL2.a + libnx; their
          # private tree presumably patched SDL or linked the GL
          # stack elsewhere. Append the mesa GL libs right after
          # libSDL2.a so the archive ordering resolves.
          sed -i 's|${DEVKITPRO}/portlibs/switch/lib/libSDL2.a|${DEVKITPRO}/portlibs/switch/lib/libSDL2.a\n  ${DEVKITPRO}/portlibs/switch/lib/libEGL.a\n  ${DEVKITPRO}/portlibs/switch/lib/libglapi.a\n  ${DEVKITPRO}/portlibs/switch/lib/libdrm_nouveau.a|' \
              dolphin/Source/Core/DolphinNX/CMakeLists.txt
          grep -A 4 'libSDL2.a' dolphin/Source/Core/DolphinNX/CMakeLists.txt | head -6

      - name: Bake autoboot rom (test builds only)
        if: inputs.autoboot_rom != ''
        shell: bash
        run: |
          # GetLaunchRomPath returns nullopt without argv and the app
          # exits — fine on hardware (foyer chain-launch passes the
          # rom), but emulators like Ryujinx can't pass NRO args.
          # Patch the final `return std::nullopt;` of GetLaunchRomPath
          # to fall back to a baked path when the file exists.
          ROM="${{ inputs.autoboot_rom }}"
          python3 - "$ROM" <<'EOF'
          import sys, re
          rom = sys.argv[1]
          p = 'dolphin/Source/Core/DolphinNX/main.cpp'
          src = open(p).read()
          marker = "    return std::string(arg);\n  }\n\n  return std::nullopt;\n}"
          repl = (
            "    return std::string(arg);\n  }\n\n"
            "  {\n"
            f"    const char* fallback = \"{rom}\";\n"
            "    struct stat st{};\n"
            "    if (::stat(fallback, &st) == 0)\n"
            "      return std::string(fallback);\n"
            "  }\n"
            "  return std::nullopt;\n}"
          )
          assert marker in src, 'GetLaunchRomPath tail not found'
          open(p, 'w').write(src.replace(marker, repl, 1))
          print('autoboot baked:', rom)
          EOF

      - name: Build dolphin-nx
        shell: bash
        run: |
          # pipefail: without it the pipe into tail swallows the
          # script's exit code and a failed build reports green.
          set -o pipefail
          cd dolphin
          export MESA_NVK_DIR=/nvk-build
          # switch-nvk's libc shim (merged into libvulkan.a) routes
          # mesa's open/close/stat/lstat/mmap through libnx-aware
          # wrappers — the wrap flags activate them. CMake folds
          # LDFLAGS into CMAKE_EXE_LINKER_FLAGS at first configure.
          export LDFLAGS="-Wl,--wrap=open -Wl,--wrap=close -Wl,--wrap=stat -Wl,--wrap=lstat"
          bash build_dolphin_standalone_nro.sh 2>&1 | tail -150

      - name: Upload NRO
        uses: actions/upload-artifact@v5
        with:
          name: dolphin-nro-${{ env.dolphin_sha }}
          path: dolphin/build_nx_standalone/dolphin.nro
          if-no-files-found: error
