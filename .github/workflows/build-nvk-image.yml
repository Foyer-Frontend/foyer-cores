name: Build NVK builder image

# Builds the Switch NVK (Mesa Vulkan) toolchain + driver tree and
# bakes both into ghcr.io/foyer-frontend/switch-nvk-builder. The
# image is the foundation for build-dolphin.yml — tico-dolphin's
# standalone NRO links Mesa NVK's libvulkan.a (MESA_NVK_DIR).
#
# Recipe: HayatoG/switch-nvk (AGPL-3.0 + copyleft fork policy — we
# run their scripts verbatim from a pinned checkout rather than
# copying them; everything here stays public which satisfies the
# policy). Their BUILD_AND_RUN.md documents the exact sequence:
#   1. docker build (devkitpro/devkita64 + meson + Rust nightly +
#      bindgen/cbindgen + LLVM-15/libclc/SPIRV tooling)
#   2. fetch Mesa 25.0.7 + apply their 9 Switch patches + the
#      VI/nwindow WSI backend (apply-patches.sh / apply-wsi-switch.sh)
#   3. 2-phase build: native mesa_clc first, then meson cross →
#      static libs under /work/mb/src/**/lib*.a
#
# Manual trigger only — this is a slow (~1h) image rebuild that's
# needed once per switch-nvk/Mesa bump, not per release.

on:
  workflow_dispatch:
    inputs:
      switch_nvk_ref:
        description: "HayatoG/switch-nvk ref to build"
        required: false
        default: "cf7388214ad1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (Mesa + Rust + LLVM need ~15 GB)
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /usr/share/dotnet /opt/ghc
          df -h /

      - name: Clone switch-nvk (pinned)
        run: |
          git clone https://github.com/HayatoG/switch-nvk.git nvk
          cd nvk
          git checkout "${{ inputs.switch_nvk_ref }}"
          echo "nvk_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build toolchain image
        run: docker build -t switch-nvk-build -f nvk/Dockerfile nvk

      - name: Fetch Mesa 25.0.7
        run: |
          curl -fsSL https://archive.mesa3d.org/mesa-25.0.7.tar.xz -o mesa.tar.xz
          tar xf mesa.tar.xz
          mv mesa-25.0.7 nvk/mesa-25
          rm mesa.tar.xz

      - name: Apply Switch source patches
        run: |
          # switch-nvk was authored on Windows — the .patch files
          # carry CRLF line endings while the Mesa tarball is LF, so
          # `patch` rejects every hunk with "different line endings".
          # Normalize the patches (and any helper scripts) to LF
          # before running their apply scripts.
          find nvk -name '*.patch' -exec sed -i 's/\r$//' {} +
          find nvk -name '*.sh'    -exec sed -i 's/\r$//' {} +
          docker run --rm -v "$PWD/nvk:/work" -w /work switch-nvk-build \
              bash /work/apply-patches.sh
          # VI is not in mesa's NVK_USE_WSI_PLATFORM platform list, so
          # the instance never advertises VK_KHR_surface even though
          # the VI WSI backend exposes VK_NN_vi_surface. Spec-correct
          # consumers (Dolphin) require base-ext + platform-ext and
          # bail. Add VI to the gate.
          # Use # as sed delimiter and double-escape for the shell.
          sed -i 's#defined(VK_USE_PLATFORM_DISPLAY_KHR)#defined(VK_USE_PLATFORM_DISPLAY_KHR) || \\\n    defined(VK_USE_PLATFORM_VI_NN)#' \
              nvk/mesa-25/src/nouveau/vulkan/nvk_physical_device.h
          grep -A 2 'VK_USE_PLATFORM_DISPLAY_KHR' nvk/mesa-25/src/nouveau/vulkan/nvk_physical_device.h | head -4

      - name: Build native tools (phase 1, pre-WSI)
        run: |
          # MUST run before apply-wsi-switch.sh: the WSI mesa-edits
          # carry NVK_TRACE diagnostics referencing
          # g_drm_shim_log_sink (defined only in the winsys shim,
          # linked at .nro time). Phase 1 builds the FULL mesa tree
          # natively to produce mesa_clc + the precomp compiler — if
          # the edits are already in the tree, the native
          # libvulkan_nouveau.so link dies on that symbol. The
          # author's persistent mount built these tools before the
          # diagnostics existed; CI rebuilds from scratch each time,
          # so order matters.
          docker run --rm -v "$PWD/nvk:/work" -w /work/mesa-25 switch-nvk-build bash -lc '
            set -e
            export NATIVE_PREFIX=/work/native-prefix
            bash /work/build-native-tools.sh'

      - name: Apply WSI backend (post-native-tools)
        run: |
          docker run --rm -v "$PWD/nvk:/work" -w /work switch-nvk-build \
              bash /work/winsys/wsi/apply-wsi-switch.sh

      - name: Build Rust std sysroot (Switch tier-3 target)
        run: |
          # rustc-switch.sh (meson's rust binary for the cross build)
          # hard-requires the prebuilt std sysroot at /work/sysroot —
          # NAK is Rust and aarch64-switch-horizon is a tier-3 target
          # with no shipped std. Also restore exec bits: the repo was
          # authored on Windows, so the wrapper scripts may land
          # without +x and meson's compiler probe reports "Unknown
          # compiler" when exec fails.
          chmod +x nvk/*.sh nvk/winsys/*.sh 2>/dev/null || true
          docker run --rm -v "$PWD/nvk:/work" -w /work switch-nvk-build \
              bash /work/build-std-sysroot.sh

      - name: Cross-build Mesa NVK (phase 2)
        run: |
          # The cross ICD .so link is EXPECTED to fail on the same
          # g_drm_shim_log_sink diagnostics — every static lib builds
          # before that final link, and consumers only use the .a's.
          # Tolerate the ninja failure and assert the libs exist.
          docker run --rm -v "$PWD/nvk:/work" -w /work/mesa-25 switch-nvk-build bash -lc '
            set -e
            export NATIVE_PREFIX=/work/native-prefix
            export PATH=/work/native-prefix/bin:$PATH
            export BUILD=/work/mb
            bash /work/configure-mesa.sh
            ninja -C /work/mb || true
            test -f /work/mb/src/nouveau/vulkan/libnvk.a
            ls /work/mb/src/**/lib*.a | head -40'

      - name: Merge loaderless libvulkan.a (tico layout)
        run: |
          # tico-dolphin links ${MESA_NVK_DIR}/src/nouveau/vulkan/
          # libvulkan.a — a single merged loaderless archive — plus
          # portlibs. Reproduce it: cross-compile switch-nvk's winsys
          # shims (drm_shim = every drm*/nouveau ioctl over libnx nv;
          # libc shim = open/mmap wraps consumers enable with
          # -Wl,--wrap=...; compat = newlib gaps) and ar-MRI-merge
          # them with libnvk.a + the support archives from the ICD
          # link set + portlibs expat (consumers link z/zstd
          # themselves, but nothing links expat for xmlconfig).
          docker run --rm -v "$PWD/nvk:/work" -w /work switch-nvk-build bash -lc '
            set -e
            DKP=/opt/devkitpro
            GCC=$DKP/devkitA64/bin/aarch64-none-elf-gcc
            AR=$DKP/devkitA64/bin/aarch64-none-elf-ar
            MB=/work/mb
            OBJ=/tmp/shim-obj; mkdir -p $OBJ
            ARCH="-march=armv8-a+crc+crypto -mtune=cortex-a57 -mtp=soft -fPIE"
            INC="-I$DKP/libnx/include -I/opt/switch-cross-include -Imesa-25/include -Imesa-25/src/nouveau/drm -Iwinsys -Icompat"
            DEFS="-D__SWITCH__ -D_GNU_SOURCE -D_DEFAULT_SOURCE -include /work/compat/switch_compat.h"
            $GCC -c winsys/drm_shim.c         -o $OBJ/drm_shim.o         $ARCH $DEFS $INC -O2
            $GCC -c winsys/switch_libc_shim.c -o $OBJ/switch_libc_shim.o $ARCH $DEFS $INC -O2
            $GCC -c compat/compat.c           -o $OBJ/compat.o           $ARCH $DEFS $INC -O2
            {
              echo "CREATE $MB/src/nouveau/vulkan/libvulkan.a"
              for a in \
                $MB/src/nouveau/vulkan/libnvk.a \
                $MB/src/nouveau/codegen/libnouveau_codegen.a \
                $MB/src/util/libmesa_util.a $MB/src/util/libmesa_util_sse41.a \
                $MB/src/util/blake3/libblake3.a $MB/src/c11/impl/libmesa_util_c11.a \
                $MB/src/nouveau/compiler/libnak.a $MB/src/nouveau/compiler/libnak_rs.a \
                $MB/src/compiler/rust/libcompiler_c_helpers.a \
                $MB/src/nouveau/headers/libnvidia_headers_c.a \
                $MB/src/nouveau/nil/liblibnil.a $MB/src/nouveau/nil/liblibnil_format_table.a \
                $MB/src/compiler/nir/libnir.a $MB/src/compiler/libcompiler.a \
                $MB/src/nouveau/mme/libnouveau_mme.a $MB/src/nouveau/winsys/libnouveau_ws.a \
                $MB/src/vulkan/util/libvulkan_util.a $MB/src/compiler/spirv/libvtn.a \
                $MB/src/util/libxmlconfig.a \
                $DKP/portlibs/switch/lib/libexpat.a; do
                echo "ADDLIB $a"
              done
              # WSI lib lives outside the ICD set but dolphin needs
              # the VK_NN_vi_surface swapchain path.
              if [ -f $MB/src/vulkan/wsi/libvulkan_wsi.a ]; then
                echo "ADDLIB $MB/src/vulkan/wsi/libvulkan_wsi.a"
              fi
              if [ -f $MB/src/vulkan/runtime/libvulkan_runtime.a ]; then
                echo "ADDLIB $MB/src/vulkan/runtime/libvulkan_runtime.a"
              fi
              echo "ADDMOD $OBJ/drm_shim.o"
              echo "ADDMOD $OBJ/switch_libc_shim.o"
              echo "ADDMOD $OBJ/compat.o"
              echo "SAVE"
              echo "END"
            } | $AR -M
            ls -la $MB/src/nouveau/vulkan/libvulkan.a'

      - name: Bake builder image (toolchain + mesa tree + build dir)
        run: |
          # Final image layers the patched Mesa source + the meson
          # build tree (static libs) on top of the toolchain at the
          # paths tico-dolphin's nx build expects to point
          # MESA_NVK_DIR at. /nvk-build mirrors the layout that
          # tico's build scripts default to.
          cat > Dockerfile.nvk-final <<'EOF'
          FROM switch-nvk-build
          COPY nvk/mesa-25 /nvk-mesa
          COPY nvk/mb /nvk-build-artifacts
          COPY nvk/winsys /nvk-winsys
          COPY nvk/compat /nvk-compat
          # MESA_NVK_DIR consumers reference both the source include
          # dirs and the built static libs through one root — symlink
          # the build artifacts into the source tree mirror.
          RUN cp -a /nvk-build-artifacts/. /nvk-mesa/ 2>/dev/null || true \
           && ln -sfn /nvk-mesa /nvk-build
          EOF
          docker build -t ghcr.io/foyer-frontend/switch-nvk-builder:${nvk_sha} \
                       -f Dockerfile.nvk-final .
          docker tag ghcr.io/foyer-frontend/switch-nvk-builder:${nvk_sha} \
                     ghcr.io/foyer-frontend/switch-nvk-builder:latest

      - name: Push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/foyer-frontend/switch-nvk-builder:${nvk_sha}
          docker push ghcr.io/foyer-frontend/switch-nvk-builder:latest
